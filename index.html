<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 旧 証ナビ（https://yatsu3-crypto.github.io/kampogairai/）の index.html と差し替える転送ページ。設計案 5-4。
     - 統合アプリ /genten/genten.html の証ナビタブ（#/shou）へ移す。履歴は積まない（location.replace）。
     - 旧の証ナビはハッシュを使っていなかったが、念のため次の形が付いていたら新しいハッシュに直す：
         #bempi・#bempi/rx・#t-rx・#/bempi/t-rx など（テーマ名＝旧 MODS のキー、タブ＝t-dx/t-cmp/t-rx/t-pt/t-herb）
         テーマ → #/shou/<テーマ>/dx、タブ付き → #/shou/<テーマ>/<タブ>、旧「生薬」タブ（t-herb）→ #/fuku/check（併用チェックに統合）
         テーマが無いときは #/shou だけ（最後に見たテーマは統合アプリ側が旧キー kampoNavi.mod から引き継ぐ。同じオリジンなので読める）。
         タブだけ付いているときは kampoNavi.mod のテーマで補う。読むだけで、何も書かない
     - JavaScript が動かないときは meta refresh（1秒後）で #/shou へ。押せるリンクも置く。
     - 所見・選んだ処方は持たない（このページは何も保存しない）。 -->
<script>
(function(){
  var TOPICS = ["mukumi","kayumi","hie","fumin","bempi","zutsu","tahan","jimei","memai","nikibi","datsumou","katakori","koe","hoteri","himan","natsuaki"];
  var TABS = ["dx","cmp","rx","pt"];
  var raw = location.hash.replace(/^#/, "");
  try { raw = decodeURIComponent(raw); } catch (e){}
  var topic = null, tab = null, herb = false;
  raw.split("/").forEach(function(p){
    p = p.replace(/^t-/, "");
    if (TOPICS.indexOf(p) !== -1) topic = p;
    else if (TABS.indexOf(p) !== -1) tab = p;
    else if (p === "herb") herb = true;
  });
  /* タブだけ付いていてテーマが無いときは、旧 証ナビが最後に保存したテーマ（kampoNavi.mod）を使う */
  if (!topic && tab){ try { var m = localStorage.getItem("kampoNavi.mod"); if (TOPICS.indexOf(m) !== -1) topic = m; } catch (e){} }
  var h = herb ? "#/fuku/check" : topic ? "#/shou/" + topic + "/" + (tab || "dx") : "#/shou";
  window.__TO = "/genten/genten.html" + h;
  location.replace(window.__TO);
})();
</script>
<meta http-equiv="refresh" content="1; url=/genten/genten.html#/shou">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF5E6">
<meta name="robots" content="noindex">
<title>証ナビは漢方総合アプリに移りました｜やまもと皮膚科・漢方クリニック</title>
<style>
:root{--washi:#FBF5E6;--card:#FFFCF4;--line:#D9CDB3;--sumi:#332C25;--sumi2:#5B5247;--ai:#22376B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Hiragino Sans","Yu Gothic",-apple-system,sans-serif;color:var(--sumi);background:var(--washi);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 56px) 20px calc(env(safe-area-inset-bottom) + 40px);text-align:center}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:21px;margin:0 0 8px}
p{color:var(--sumi2);margin:0 0 22px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;background:var(--ai);color:#FFFCF4;font-weight:700;font-size:15px;text-decoration:none}
.foot{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:11px;color:var(--sumi2);margin-top:40px;border-top:1px dashed var(--line);padding-top:14px}
</style>
</head>
<body>
<main>
  <h1>証ナビは漢方総合アプリに移りました</h1>
  <p>自動で移動します。移らないときは下のボタンを押してください。</p>
  <a class="btn" id="go" href="/genten/genten.html#/shou">漢方総合アプリ（証ナビ）を開く</a>
  <div class="foot">やまもと皮膚科・漢方クリニック</div>
</main>
<script>if (window.__TO) document.getElementById("go").href = window.__TO;</script>
</body>
</html>
